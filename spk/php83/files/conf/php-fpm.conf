;;;;;;;;;;;;;;;;;;;;;
; FPM Configuration ;
;;;;;;;;;;;;;;;;;;;;;

[global]
pid = /var/packages/php83/var/run/php-fpm.pid
error_log = /var/packages/php83/var/log/php-fpm.log
log_level = notice
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
daemonize = yes

;;;;;;;;;;;;;;;;;;;;
; Pool Definitions ;
;;;;;;;;;;;;;;;;;;;;

[www]
user = http
group = http
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Tuned for Synology DS920+ (4GB RAM typical)
; Adjust based on actual workload

; Logging
php_admin_value[error_log] = /var/packages/php83/var/log/php-fpm-www-error.log
php_admin_flag[log_errors] = on

; Session path
php_value[session.save_handler] = files
php_value[session.save_path] = /var/packages/php83/var/sessions

; Security
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
